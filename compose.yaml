services:
  db:
    image: sankhyaimages/skdev-oracle:1.1.0
    platform: linux/amd64
    restart: "no"
    shm_size: 1gb
    mem_limit: ${ORACLE_MEMORY:-3g}
    ports:
      - "127.0.0.1:1521:1521"
      - "127.0.0.1:5500:5500"
    volumes:
      - oracle-data:/u01/app/oracle/oradata
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 2m
volumes:
  oracle-data:
